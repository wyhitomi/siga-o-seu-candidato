name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token (instead of GITHUB_TOKEN) lets the release PR trigger CI.
      # The app needs Contents and Pull requests: read & write on this repository.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID || secrets.APP_ID }}
          private-key: ${{ secrets.APP_ID_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
