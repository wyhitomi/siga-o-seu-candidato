# Ambiente de desenvolvimento completo: `docker compose up --build`
# Apenas a infraestrutura: `docker compose up -d db redis mailpit`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siga
      POSTGRES_PASSWORD: siga
      POSTGRES_DB: siga
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siga -d siga"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Captura os e-mails de login em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://siga:siga@db:5432/siga
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: '["http://localhost:3000"]'
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
